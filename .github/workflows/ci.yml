name: CI
on: [push, pull_request]

jobs:
  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every Swift file carries an SPDX identifier
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -3 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "::error file=$f::missing SPDX identifier"
              missing=1
            fi
          done < <(find Sources Tests -name '*.swift')
          exit $missing

  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # Resolves swift-hamvoip from its tag over the network; no sibling
      # checkout is involved since the dependency became versioned.
      - name: Generate the project
        run: xcodegen generate

      # CODE_SIGNING_ALLOWED=NO so CI needs no signing identity and no team.
      # DEVELOPMENT_TEAM in project.yml is for local device builds only.
      - name: Build (iOS)
        run: |
          xcodebuild build \
            -scheme Currawong \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme Currawong \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (macOS)
        run: |
          xcodebuild test \
            -scheme Currawong \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
