# Currawong — XcodeGen project definition.
#
# The .xcodeproj is generated, never committed. Regenerate with `make generate`
# (or `xcodegen generate`) after changing this file or adding source files.

name: Currawong

options:
  bundleIdPrefix: au.charlesmartin
  createIntermediateGroups: true
  deploymentTarget:
    # **iOS 16.2, raised for APP-3 (SF-4).** The maintainer's call of 2026-08-16
    # was to raise the floor for ActivityKit rather than scatter availability
    # guards, and to make it whatever the implementation actually calls.
    # ActivityKit itself is 16.1; `ActivityContent` (stale dates),
    # `Activity.update(_:)` taking one, and `end(_:dismissalPolicy:)` are 16.2,
    # and all three are what stop the Live Activity from lying — see
    # `Sources/Currawong/ActivityKitPresenter.swift`.
    #
    # **The library's floor stays at iOS 16.0.** Nothing in `swift-hamvoip`
    # needs ActivityKit, and an app-driven bump to a protocol library would be
    # the tail wagging the dog.
    iOS: "16.2"
    macOS: "13.0"
  minimumXcodeGenVersion: "2.42.0"
  xcodeVersion: "16.0"

packages:
  # Versioned git dependency. v0.3.0 added EchoLink (`EchoLinkKit`) and made
  # `NetworkClient` a seam an app can be written against (RC-10); v0.4.0 added
  # public proxy discovery (`EchoLinkProxySelector`, EL-12), which is what
  # ``EchoLinkProxyFinder`` is built on; **v0.5.4 is the floor** — v0.5.0 added the
  # Web Transceiver fields `IAX2Destination.callingNumber` and `callingName`
  # (IAX-12), v0.5.1 carries an SF-1 reentrancy fix, v0.5.2 adds the portal
  # token fetch (IAX-13), v0.5.3 adds the static
  # `AudioPipeline.activateSession()` (RC-11) that let this app delete its own
  # copy of the audio-session policy (`BU-3`), and v0.5.4 adds the listening
  # policy (RC-12) that holds HFP only while transmitting. v0.6.0/v0.6.1 carry
  # `M17Kit.WeebillVoiceCodec` (M17-7), the pure-Swift Codec 2 this app's M17
  # path uses instead of its own `Codec2Codec` (APP-27), and RC-13, which gave
  # `AudioPipeline.Signal.routeChanged` an `AudioRouteChangeCause` payload — the
  # app adopted that because 0.6.0 forced it, not because it wanted to. The two
  # tags carry identical code; v0.6.0's is not reachable from the library's
  # `main` (that repo allows only rebase merges, which rewrite SHAs), so v0.6.1
  # was cut from `main` and is the one to name.
  #
  # v0.6.2 (APP-29) took RC-14: `AudioPipeline` now rebuilds
  # the capture chain on `.AVAudioEngineConfigurationChange` instead of only
  # announcing it. Before, a live tap kept resampling from the old rate and
  # striding by the old channel count — `source[index * channelStride]` reading
  # past channel 0's allocation on the real-time audio thread. This app produces
  # exactly that notification mid-over whenever the operator changes the default
  # input device, which is the 1.5 s window `BU-23` is about. **Taking this
  # release does not close `BU-23`** — that task says so itself, and only the
  # ASan run settles it; the app takes the fix on its own merits. Also adds two
  # rebuild counters on `AudioPipeline`, which nothing here reads yet, and the
  # `experiment input-warm-up` probe behind `BU-22`'s hold constant. Nothing the
  # app calls changed signature, so this is a floor bump and no code with it.
  #
  # **v0.7.0 is the floor** (APP-30), for RC-15 — and this one is not optional.
  # `startCapture` handed `installTap` a format it had snapshotted moments
  # earlier, and when the input device changed inside that window AVFAudio
  # rejected the install by raising an Objective-C `NSException`. No Swift
  # `catch` can intercept one, so the process was terminated instead. **This app
  # is where that happened:** Currawong died on air on 2026-08-29 from inside a
  # `do/catch` written to tolerate exactly that failure, which is `BU-24`. The
  # library now installs the tap with no format at all and verifies the chain
  # against what the node reports afterwards, so the mismatch is unreachable
  # rather than handled. (**Wrong — see the v0.8.0 paragraph below.**) A build resolving 0.6.2 is a build that can still kill
  # itself at connect, which is why the pinned resolve below matters more than
  # usual here. Additive API only — `AudioPipelineError` gains
  # `.inputFormatUnstable`, which nothing here switches over — so again no code
  # beside the bump.
  #
  # **v0.8.0 is the floor** (`BU-25`), for RC-16 — and it corrects the paragraph
  # above rather than adding to it. *"The mismatch is unreachable"* was wrong: a
  # `nil` format makes AVFAudio use the input **node's** format, not the
  # **hardware's**, and those two are allowed to disagree, so the raise stayed
  # reachable. Worse, `AudioPipeline` released its one lock with a `defer`, and
  # **a Swift `defer` does not run when an Objective-C exception unwinds through
  # it** — the lock was not released late, it was orphaned for the life of the
  # process, and AppKit swallowed the exception at the run loop. The app stayed
  # up, kept its window and never responded again, with a dead audio pipeline.
  # **On a transmit path that is worse than 0.7.0's crash:** nothing tells the
  # operator the radio has stopped working. The library now keeps state and
  # graph under two locks — one never held across a call into AVFAudio, the
  # other only ever taken with a deadline — so a raise costs the audio path
  # rather than a caller's thread, and checks node against hardware before
  # installing at all. Confirmed on air 2026-08-29: the `BU-25` sequence did not
  # reproduce across three input devices. Additive API again — three new
  # `AudioPipelineError` cases, none of which this app switches over — so once
  # more no code beside the bump.
  # `from:` accepts any 0.x above it — the library is 0.x, so its own
  # changelog warns the API may change in any release; `Currawong.xcodeproj/…/Package.resolved` is what actually
  # pins the build, and it is generated, so a fresh `make generate` resolves
  # forward. Pin exactly here if that ever bites.
  #
  # Locally, that generated file is the whole story. **On Xcode Cloud it is
  # not:** resolution runs with automatic resolution disabled there, so the pin
  # is committed as `ci_scripts/Package.resolved` and copied into the generated
  # project by the post-clone script. Change a version here and run
  # `make resolved` in the same commit, or the cloud build keeps building the
  # old one until the pin goes stale and then fails outright.
  #
  # To work on the app and the library together, swap this for the path
  # dependency below and regenerate. Do not commit the swap.
  #
  #   HamVoIP:
  #     path: ../swift-hamvoip
  HamVoIP:
    url: https://github.com/cpmpercussion/swift-hamvoip
    from: 0.8.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # PD-5: TestFlight (iOS) and Developer ID + notarisation (macOS) both need a
    # team. Override on the command line or in a local xcconfig if you are
    # building this under a different account:
    #   xcodebuild ... DEVELOPMENT_TEAM=XXXXXXXXXX
    # or drop signing entirely for a CI build:
    #   xcodebuild ... CODE_SIGNING_ALLOWED=NO
    DEVELOPMENT_TEAM: EDH387FRHA
    CODE_SIGN_STYLE: Automatic

targets:
  Currawong:
    type: application
    # One multiplatform target rather than two per-platform ones: the app is the
    # same app on both, and the library targets iOS 16 / macOS 13 alike.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/Currawong
        excludes:
          - Info.plist
          # Consumed by the signing phase, not copied into the bundle.
          - Currawong.entitlements
      # Compiled into the app *and* into the widget extension, which are two
      # processes that have to agree on the archived shape of the Live Activity's
      # state. A shared source directory rather than a framework target: it is
      # two small value types with no behaviour, and a framework for them would
      # be a signing and embedding problem in exchange for nothing.
      - path: Sources/LiveActivityShared
    dependencies:
      # The app depends on the library products only. It talks to IAX2Kit and
      # M17Kit through RadioCore's `NetworkClient`; the concrete `IAX2Client`
      # and `M17Client` are named in exactly one file, CompositionRoot.swift.
      - package: HamVoIP
        products:
          - RadioCore
          - IAX2Kit
          - M17Kit
          - EchoLinkKit

      # Codec2 3200 (FR-2.4), the voice codec M17 stream mode carries.
      #
      # **Embed & Sign, never statically linked** — LP-4. Codec2 is LGPL-2.1
      # and we ship it only as a dynamic framework carrying its own COPYING.
      # Do not add `-force_load`/`-all_load` for it, and do not switch this to
      # a static link: that would pull LGPL objects into the app binary.
      #
      # Why the app carries its own copy at all, when the library also knows
      # how to build one: the library's `Codec2VoiceCodec` is compiled out for
      # anyone consuming it over SPM. The XCFramework is 7.6 MB of LGPL binary
      # and is not committed to either repository, so a resolved SPM checkout
      # never contains it — and nothing can run a build script inside that
      # checkout. Hence `Sources/Currawong/Codec2Codec.swift`, the app's own
      # conformance, injected into `M17Client`. See docs/CODEC2.md.
      #
      # Built by `scripts/build-codec2-xcframework.sh`; `make` builds it
      # automatically when it is missing. Not in version control (.gitignore).
      - framework: Codec2.xcframework
        embed: true
        codeSign: true

      # **APP-3.** The Live Activity's widget extension, embedded in the app.
      # `platformFilter: iOS` is load-bearing: this is one multiplatform target
      # and macOS has no Live Activities, so without the filter the macOS build
      # tries to embed an iOS-only appex and fails.
      - target: CurrawongLiveActivity
        platformFilter: iOS
    info:
      path: Sources/Currawong/Info.plist
      properties:
        CFBundleDisplayName: Currawong
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright 2026 Currawong contributors. Apache-2.0."

        # Answers App Store Connect's export-compliance question once, here,
        # instead of on every build upload. `false` is the true answer:
        # nothing in the app or the library encrypts anything. M17's TYPE
        # field encryption bits are *read* so an encrypted stream can be
        # refused rather than played as noise (FR-2.5), and no cipher is
        # implemented anywhere — see M17ReflectorProtocol.Playability. The
        # IAX2 and EchoLink MD5 challenge-response is authentication, and the
        # portal login's HTTPS is the OS's own TLS; both are exempt.
        #
        # Revisit this the day any of that stops being true.
        ITSAppUsesNonExemptEncryption: false

        # PD-2. `audio` keeps the call alive with the screen locked; a
        # `bluetooth-central` app keeps its BLE PTT link in the background
        # (PT-2). Neither needs Apple approval, and nothing else is requested —
        # in particular there is no multicast entitlement (PD-3), no VoIP mode,
        # and CallKit is not used (PD-4).
        UIBackgroundModes:
          - audio
          - bluetooth-central

        # Required. Without microphone access the app cannot transmit, which is
        # most of what it is for.
        NSMicrophoneUsageDescription:
          "Currawong needs the microphone to transmit your voice to the node or reflector you are connected to."
        # Needed by the BLE PTT accessory support in Phase 5 (PT-2, PT-3).
        NSBluetoothAlwaysUsageDescription:
          "Currawong connects to Bluetooth push-to-talk accessories so a physical button can key your transmission."

        # Required to reach a node on the same network as the device — a node in
        # a VM on the desk, on a Raspberry Pi, or anywhere else with a LAN
        # address. iOS 14 and later gate *any* local-network traffic behind a
        # user prompt, and without this key the system denies the connection
        # instead of asking, which presents as a connect that times out for no
        # visible reason.
        #
        # This is a usage description, not an entitlement: it is unrelated to
        # `com.apple.developer.networking.multicast`, which PD-3 forbids and
        # which is not requested. Nothing here browses or advertises Bonjour
        # services either, so there is no NSBonjourServices list.
        NSLocalNetworkUsageDescription:
          "Currawong needs to reach AllStarLink nodes on your local network, such as a node running on your own computer or a Raspberry Pi."

        # **APP-3 (SF-4).** Without this key ActivityKit reports Live
        # Activities as unavailable and `Activity.request` throws, which
        # presents as a lock screen that simply never shows a transmitter.
        NSSupportsLiveActivities: true

        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.charlesmartin.currawong
        PRODUCT_NAME: Currawong
        GENERATE_INFOPLIST_FILE: NO
        # The icon lives in Sources/Currawong/Assets.xcassets; regenerate the
        # PNGs from Design/AppIcon*.svg with scripts/generate-app-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Extensions extend the identifier (au.charlesmartin.currawong.liveactivity);
        # the Keychain access group is $(TeamID).au.charlesmartin.currawong.

        # Where dyld looks for the embedded Codec2.framework, which is the
        # difference between an app that runs and one that dies on launch.
        #
        # The two platforms put it in different places — `Currawong.app/
        # Frameworks` on iOS, `Currawong.app/Contents/Frameworks` on macOS —
        # and this is one multiplatform target, so a single value cannot be
        # right for both. The default here is the iOS one, which built a macOS
        # bundle whose executable searched `Contents/MacOS/Frameworks` and
        # found nothing: `make build-macos` succeeded and the app then failed
        # in dyld with "Library not loaded: @rpath/Codec2.framework". The tests
        # solve the same iOS-versus-macOS layout question with
        # BUNDLE_EXECUTABLE_FOLDER_PATH below; there is no equivalent variable
        # for an executable-relative frameworks path, so this is conditioned on
        # the SDK instead.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"

        # The Keychain access group. Required on macOS for the data protection
        # keychain `KeychainSecretStore` asks for, and a no-op restatement of
        # the implicit group on iOS — see the comment in the file itself.
        CODE_SIGN_ENTITLEMENTS: Sources/Currawong/Currawong.entitlements
    scheme:
      testTargets:
        - CurrawongTests
      gatherCoverageData: true

  # **APP-3 (SF-4).** The Live Activity, in its own process because that is what
  # a widget extension is. Bundle identifier reserved by the OQ-3b resolution.
  #
  # iOS only, and that is not a limitation to work around: macOS has no Live
  # Activities at all, so there is nothing here to build for it. The app's macOS
  # build and `make test-macos` are part of APP-3's definition of done and see
  # none of this.
  CurrawongLiveActivity:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: Sources/CurrawongLiveActivity
      - path: Sources/LiveActivityShared
    info:
      path: Sources/CurrawongLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Currawong Transmit
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.charlesmartin.currawong.liveactivity
        PRODUCT_NAME: CurrawongLiveActivity
        GENERATE_INFOPLIST_FILE: NO
        # No entitlements: the extension reads nothing, stores nothing and
        # reaches no network. It draws the state the app hands it.
        SKIP_INSTALL: YES

  CurrawongTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests/CurrawongTests
    dependencies:
      - target: Currawong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.charlesmartin.currawong.tests
        GENERATE_INFOPLIST_FILE: YES
        # Hosted by the app so `@testable import Currawong` links. The
        # BUNDLE_EXECUTABLE_FOLDER_PATH indirection is what makes one setting
        # correct for both iOS (executable at the bundle root) and macOS
        # (Contents/MacOS).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Currawong.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Currawong"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # On-air UI test (BU-8). NOT in the Currawong scheme's testTargets, and that
  # omission is the whole point: this target *transmits*, so it must never run
  # under `make test` or in CI. It runs from its own scheme, deliberately, and
  # only when somebody means it.
  # **iOS as well as macOS since 2026-08-23.** `BU-15`'s iOS trigger is a
  # category change that only the device reports — the simulator moves the route
  # and posts no notification at all (`BU15SessionProbeTests`), so a real iPhone
  # is the only place that fault can be seen. The macOS-shaped tests in this
  # target — `BU-9`'s delete bug, which is *about* macOS — stay behind
  # `#if os(macOS)`; the on-air M17 test drives both.
  CurrawongOnAirUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS, iOS]
    sources:
      - Tests/CurrawongOnAirUITests
    dependencies:
      - target: Currawong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.charlesmartin.currawong.onair-uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Currawong

schemes:
  # The on-air test's own scheme. `make test` uses the Currawong scheme, which
  # does not list this target, so the two cannot be run by accident.
  CurrawongOnAir:
    build:
      targets:
        Currawong: [test]
        CurrawongOnAirUITests: [test]
    test:
      targets:
        - CurrawongOnAirUITests
      gatherCoverageData: false
