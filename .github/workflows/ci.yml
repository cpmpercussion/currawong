name: CI
on: [push, pull_request]

jobs:
  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every Swift file carries an SPDX identifier
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -3 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "::error file=$f::missing SPDX identifier"
              missing=1
            fi
          done < <(find Sources Tests -name '*.swift')
          exit $missing

  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # Codec2.xcframework is a build prerequisite — project.yml embeds it for
      # M17 audio (FR-2.4) — and it is not in version control, so CI builds it
      # like any other fresh clone. Roughly four minutes, hence the cache; see
      # docs/CODEC2.md.
      #
      # The key covers the build script, which is also where the pinned codec2
      # tag and commit live, so a change to either the recipe or the upstream
      # it pins produces a new key.
      - name: Cache Codec2.xcframework
        id: codec2-cache
        uses: actions/cache@v4
        with:
          path: Codec2.xcframework
          key: codec2-${{ runner.os }}-${{ hashFiles('scripts/build-codec2-xcframework.sh') }}

      - name: Build Codec2.xcframework
        if: steps.codec2-cache.outputs.cache-hit != 'true'
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          scripts/build-codec2-xcframework.sh

      # Resolves swift-hamvoip from its tag over the network; no sibling
      # checkout is involved since the dependency became versioned.
      - name: Generate the project
        run: xcodegen generate

      # CODE_SIGNING_ALLOWED=NO so CI needs no signing identity and no team.
      # DEVELOPMENT_TEAM in project.yml is for local device builds only.
      - name: Build (iOS)
        run: |
          xcodebuild build \
            -scheme Currawong \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme Currawong \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (macOS)
        run: |
          xcodebuild test \
            -scheme Currawong \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
