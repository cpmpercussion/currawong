name: CI
# **Push is scoped to `main`.** `on: [push, pull_request]` fires both events for
# every commit on a branch with an open PR, so the whole matrix ran twice per
# commit for no extra coverage.
on:
  push:
    branches: [main]
  pull_request:
  # The nightly full run — see the note on the iOS Simulator step.
  schedule:
    - cron: '0 16 * * *'  # 02:00 AEST
  workflow_dispatch:

jobs:
  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every Swift file carries an SPDX identifier
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -3 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "::error file=$f::missing SPDX identifier"
              missing=1
            fi
          done < <(find Sources Tests -name '*.swift')
          exit $missing

  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # Codec2.xcframework is a build prerequisite — project.yml embeds it for
      # M17 audio (FR-2.4) — and it is not in version control, so CI builds it
      # like any other fresh clone. Roughly four minutes, hence the cache; see
      # docs/CODEC2.md.
      #
      # The key covers the build script, which is also where the pinned codec2
      # tag and commit live, so a change to either the recipe or the upstream
      # it pins produces a new key.
      - name: Cache Codec2.xcframework
        id: codec2-cache
        uses: actions/cache@v4
        with:
          path: Codec2.xcframework
          key: codec2-${{ runner.os }}-${{ hashFiles('scripts/build-codec2-xcframework.sh') }}

      - name: Build Codec2.xcframework
        if: steps.codec2-cache.outputs.cache-hit != 'true'
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          scripts/build-codec2-xcframework.sh

      # **APP-26.** Cheap, and it guards a condition on the right to distribute
      # rather than a style rule: that the versions the About screen claims match
      # the artefacts they describe, that Codec2 still ships as a dynamic library
      # with its licence text, and that the notices the LGPL and libgsm require
      # are still in the source. Runs on every push, so drift is caught by the
      # commit that causes it rather than by a release. See docs/LICENSING.md.
      - name: Licence notices
        run: scripts/check-licence-notices.sh

      # Resolves swift-hamvoip from its tag over the network; no sibling
      # checkout is involved since the dependency became versioned.
      - name: Generate the project
        run: xcodegen generate

      # CODE_SIGNING_ALLOWED=NO so CI needs no signing identity and no team.
      # DEVELOPMENT_TEAM in project.yml is for local device builds only.
      - name: Build (iOS)
        run: |
          xcodebuild build \
            -scheme Currawong \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      # **Not on pull requests**, where it was 447s of a 634s run — 71% of the
      # wall clock a task waits on. It is also the *cheapest* step to move,
      # because it covers less than the macOS run does: `Tests/` has one
      # platform gate in 41 files, `#if os(macOS)` in
      # `ChannelListContextMenuTests`, and no `#if os(iOS)` anywhere. So the
      # simulator executes the same test code as macOS, minus the macOS-only
      # test, at four times the cost. The iOS-only source that does exist is
      # mostly view modifiers, which is compile risk — and `Build (iOS)` above
      # catches that in 61s. No test references `ActivityKitPresenter`, and
      # `AudioIO` and `CoreBluetoothCentral` are reached through `Fakes.swift`.
      #
      # It still runs on every merge to `main`, nightly, and on demand, so an
      # iOS-only runtime regression is caught within a day and cannot reach a
      # release. What it no longer does is gate each PR.
      - name: Test (iOS Simulator)
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild test \
            -scheme Currawong \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (macOS)
        run: |
          xcodebuild test \
            -scheme Currawong \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
