# Currawong — XcodeGen project definition.
#
# The .xcodeproj is generated, never committed. Regenerate with `make generate`
# (or `xcodegen generate`) after changing this file or adding source files.

name: Currawong

options:
  bundleIdPrefix: au.charlesmartin
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  minimumXcodeGenVersion: "2.42.0"
  xcodeVersion: "16.0"

packages:
  # Versioned git dependency. v0.3.0 added EchoLink (`EchoLinkKit`) and made
  # `NetworkClient` a seam an app can be written against (RC-10); v0.4.0 added
  # public proxy discovery (`EchoLinkProxySelector`, EL-12), which is what
  # ``EchoLinkProxyFinder`` is built on. `from:` accepts any 0.4.x — the library
  # is 0.x, so its own changelog warns the API may change in any release;
  # `Currawong.xcodeproj/…/Package.resolved` is what actually pins the build,
  # and it is generated, so a fresh `make generate` resolves forward. Pin
  # exactly here if that ever bites.
  #
  # To work on the app and the library together, swap this for the path
  # dependency below and regenerate. Do not commit the swap.
  #
  #   HamVoIP:
  #     path: ../swift-hamvoip
  HamVoIP:
    url: https://github.com/cpmpercussion/swift-hamvoip
    from: 0.4.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # PD-5: TestFlight (iOS) and Developer ID + notarisation (macOS) both need a
    # team. Override on the command line or in a local xcconfig if you are
    # building this under a different account:
    #   xcodebuild ... DEVELOPMENT_TEAM=XXXXXXXXXX
    # or drop signing entirely for a CI build:
    #   xcodebuild ... CODE_SIGNING_ALLOWED=NO
    DEVELOPMENT_TEAM: EDH387FRHA
    CODE_SIGN_STYLE: Automatic

targets:
  Currawong:
    type: application
    # One multiplatform target rather than two per-platform ones: the app is the
    # same app on both, and the library targets iOS 16 / macOS 13 alike.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/Currawong
        excludes:
          - Info.plist
    dependencies:
      # The app depends on the library products only. It talks to IAX2Kit and
      # M17Kit through RadioCore's `NetworkClient`; the concrete `IAX2Client`
      # and `M17Client` are named in exactly one file, CompositionRoot.swift.
      - package: HamVoIP
        products:
          - RadioCore
          - IAX2Kit
          - M17Kit
          - EchoLinkKit

      # Codec2 3200 (FR-2.4), the voice codec M17 stream mode carries.
      #
      # **Embed & Sign, never statically linked** — LP-4. Codec2 is LGPL-2.1
      # and we ship it only as a dynamic framework carrying its own COPYING.
      # Do not add `-force_load`/`-all_load` for it, and do not switch this to
      # a static link: that would pull LGPL objects into the app binary.
      #
      # Why the app carries its own copy at all, when the library also knows
      # how to build one: the library's `Codec2VoiceCodec` is compiled out for
      # anyone consuming it over SPM. The XCFramework is 7.6 MB of LGPL binary
      # and is not committed to either repository, so a resolved SPM checkout
      # never contains it — and nothing can run a build script inside that
      # checkout. Hence `Sources/Currawong/Codec2Codec.swift`, the app's own
      # conformance, injected into `M17Client`. See docs/CODEC2.md.
      #
      # Built by `scripts/build-codec2-xcframework.sh`; `make` builds it
      # automatically when it is missing. Not in version control (.gitignore).
      - framework: Codec2.xcframework
        embed: true
        codeSign: true
    info:
      path: Sources/Currawong/Info.plist
      properties:
        CFBundleDisplayName: Currawong
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright 2026 Currawong contributors. Apache-2.0."

        # PD-2. `audio` keeps the call alive with the screen locked; a
        # `bluetooth-central` app keeps its BLE PTT link in the background
        # (PT-2). Neither needs Apple approval, and nothing else is requested —
        # in particular there is no multicast entitlement (PD-3), no VoIP mode,
        # and CallKit is not used (PD-4).
        UIBackgroundModes:
          - audio
          - bluetooth-central

        # Required. Without microphone access the app cannot transmit, which is
        # most of what it is for.
        NSMicrophoneUsageDescription:
          "Currawong needs the microphone to transmit your voice to the node or reflector you are connected to."
        # Needed by the BLE PTT accessory support in Phase 5 (PT-2, PT-3).
        NSBluetoothAlwaysUsageDescription:
          "Currawong connects to Bluetooth push-to-talk accessories so a physical button can key your transmission."

        # Required to reach a node on the same network as the device — a node in
        # a VM on the desk, on a Raspberry Pi, or anywhere else with a LAN
        # address. iOS 14 and later gate *any* local-network traffic behind a
        # user prompt, and without this key the system denies the connection
        # instead of asking, which presents as a connect that times out for no
        # visible reason.
        #
        # This is a usage description, not an entitlement: it is unrelated to
        # `com.apple.developer.networking.multicast`, which PD-3 forbids and
        # which is not requested. Nothing here browses or advertises Bonjour
        # services either, so there is no NSBonjourServices list.
        NSLocalNetworkUsageDescription:
          "Currawong needs to reach AllStarLink nodes on your local network, such as a node running on your own computer or a Raspberry Pi."

        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.charlesmartin.currawong
        PRODUCT_NAME: Currawong
        GENERATE_INFOPLIST_FILE: NO
        # The icon lives in Sources/Currawong/Assets.xcassets; regenerate the
        # PNGs from Design/AppIcon*.svg with scripts/generate-app-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Extensions extend the identifier (au.charlesmartin.currawong.liveactivity);
        # the Keychain access group is $(TeamID).au.charlesmartin.currawong.

        # Where dyld looks for the embedded Codec2.framework, which is the
        # difference between an app that runs and one that dies on launch.
        #
        # The two platforms put it in different places — `Currawong.app/
        # Frameworks` on iOS, `Currawong.app/Contents/Frameworks` on macOS —
        # and this is one multiplatform target, so a single value cannot be
        # right for both. The default here is the iOS one, which built a macOS
        # bundle whose executable searched `Contents/MacOS/Frameworks` and
        # found nothing: `make build-macos` succeeded and the app then failed
        # in dyld with "Library not loaded: @rpath/Codec2.framework". The tests
        # solve the same iOS-versus-macOS layout question with
        # BUNDLE_EXECUTABLE_FOLDER_PATH below; there is no equivalent variable
        # for an executable-relative frameworks path, so this is conditioned on
        # the SDK instead.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    scheme:
      testTargets:
        - CurrawongTests
      gatherCoverageData: true

  CurrawongTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests/CurrawongTests
    dependencies:
      - target: Currawong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.charlesmartin.currawong.tests
        GENERATE_INFOPLIST_FILE: YES
        # Hosted by the app so `@testable import Currawong` links. The
        # BUNDLE_EXECUTABLE_FOLDER_PATH indirection is what makes one setting
        # correct for both iOS (executable at the bundle root) and macOS
        # (Contents/MacOS).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Currawong.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Currawong"
        BUNDLE_LOADER: "$(TEST_HOST)"
